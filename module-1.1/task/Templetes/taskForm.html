<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Task Form</title>
  </head>
  <body>

      {% csrf_token %} {% comment %} <label for="">Title</label>

    </form>
  </body>
</html>
